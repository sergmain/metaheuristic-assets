version: 3
function:
  # the deterministic agreement of the readings sessions and the probe's meta-storage records (plan 050 Phase 2)
  code: mh.asset.nrvv-concept-agree_1.0
  type: mh.asset.nrvv-concept-agree
  env: python-3
  sourcing: git
  # The payload is NOT packaged into this bundle - it is reached only through this block. HEAD, never a tag:
  # the Dispatcher re-resolves the tip at every ExecContext creation and pins the sha into every Task.
  # Every Function of this capability shares the payload directory; each names its own script.
  git:
    repo: https://github.com/sergmain/metaheuristic-assets.git
    branch: master
    commit: HEAD
    path: nrvv/payload/fn-nrvv
  targets:
    mh-default:
      src: src
      file: nrvv_concept_agree.py
  metas:
    # 2: every variable is named by a process meta
    - mh.task-params-version: 2
