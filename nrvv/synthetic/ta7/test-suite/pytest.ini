# The synthetic test-suite of NRVV v2's gas-price run (plan 043, Phase 13): nrvv-test-author writes the client
# simulation tests/nrvv_env/, tests/test_<suite>.py and suites/<suite>.suite here; nrvv-suite-run runs the suites with
# this dir as cwd and rootdir. No cache: a run must leave nothing behind that a later commit-push would commit.
[pytest]
addopts = -p no:cacheprovider
