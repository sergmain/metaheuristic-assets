version: 3
function:
  # mh.asset.call-cc on the Google Gemini API path: the same payload as fn-call-cc (call-cc/payload/fn-call-cc), whose
  # mh_call_cc.py runs the gemini_api path when the process meta llm_provider = "gemini_api" (mh_gemini_call.py), under
  # its OWN code because it carries the api block below - a Function code declares exactly one api.keyCode, and
  # fn-call-cc-api's is ANTHROPIC_API_KEY. The reasoning of fn-call-cc-api applies unchanged: a SourceCode that wants
  # this path names this code AND sets llm_provider = "gemini_api".
  code: mh.asset.call-cc-gemini_1.0
  type: mh.asset.call-cc
  env: python-3
  sourcing: git
  cleaningPolicy: ASSETS, FULL_AFTER_ONE_WEEK
  # HEAD, never a tag: the Dispatcher re-resolves the tip at every ExecContext creation and pins the sha into every Task
  # of that run. The whole payload dir is copied into {task.home}/asset, so mh_gemini_call.py travels with the entry.
  git:
    repo: https://github.com/sergmain/metaheuristic-assets.git
    branch: master
    commit: HEAD
    path: call-cc/payload/fn-call-cc
  targets:
    mh-default:
      src: src
      file: mh_call_cc.py
  metas:
    # 2, not 1: every input is named by a process meta, and task.metas does not exist before params version 2
    - mh.task-params-version: 2
  # The Processor seals this Vault entry and hands it over its loopback secret channel (task.secretPort,
  # task.checkCode in the params file); mh_api_call.read_secret takes it and the Function zeroes it after the call.
  api:
    keyCode: GEMINI_API_KEY
  # Matched against a failed Task's console. Anchored on mh_gemini_call.api_failure_line, which run_gemini_api prints on
  # a non-2xx response:   FAILED: Gemini API call failed with status <code>; body=<first 2000 chars>
  # The body is Google's error envelope, pretty-printed: {"error": {"code": 404, "message": "...", "status": "NOT_FOUND"}}
  analyzers:
    # Quota exhausted: every Task using this key would hit the same wall, so the block is on the KEY.
    - name: api-quota-exhausted
      regex:
        - 'Gemini API call failed with status 429'
        - '"status":\s*"RESOURCE_EXHAUSTED"'
      timeout: 20min
      incrementTries: false
      scope: api
    # Provider-side transient trouble - clears on its own in minutes.
    - name: api-provider-unavailable
      regex:
        - 'Gemini API call failed with status 500'
        - 'Gemini API call failed with status 503'
        - 'Gemini API call failed with status 504'
        - '"status":\s*"UNAVAILABLE"'
        - '"status":\s*"INTERNAL"'
        - '"status":\s*"DEADLINE_EXCEEDED"'
      timeout: 5min
      incrementTries: false
      scope: api
    # A rejected credential is not transient: the Task spends its retries and lands in ERROR, where a human sees it.
    # (Google answers an invalid key with 400 INVALID_ARGUMENT, reason API_KEY_INVALID - not 401.)
    - name: api-credentials-rejected
      regex:
        - 'Gemini API call failed with status 401'
        - 'Gemini API call failed with status 403'
        - '"status":\s*"UNAUTHENTICATED"'
        - '"status":\s*"PERMISSION_DENIED"'
        - 'API_KEY_INVALID'
      timeout: 30min
      incrementTries: true
      scope: api
