version: 3
function:
  code: mh.asset.rg-req-store_1.0
  type: mh.asset.rg-req-store
  env: python-3
  sourcing: git
  # The payload is NOT packaged into this bundle - it is reached only through this block. HEAD, never a tag:
  # the Dispatcher re-resolves the tip at every ExecContext creation and pins the sha into every Task.
  # Both Functions of this capability share the payload directory; each names its own script.
  git:
    repo: https://github.com/sergmain/metaheuristic-assets.git
    branch: master
    commit: HEAD
    path: rg-requirements/payload/fn-rg-requirements
  targets:
    mh-default:
      src: src
      file: mh_rg_req_store.py
  # The RG credential: the vault entry holds the plain login:password of an RG account. The Processor fetches it
  # sealed and hands it to the Function over its loopback secret channel - never argv, env or disk.
  api:
    keyCode: RG_API_AUTH
  metas:
    # 2: every variable is named by a process meta, and 2 carries task.checkCode / task.secretPort
    - mh.task-params-version: 2
